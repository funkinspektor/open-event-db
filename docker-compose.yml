services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: oedb
      POSTGRES_PASSWORD: oedb
      POSTGRES_DB: oedb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oedb -d oedb']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
