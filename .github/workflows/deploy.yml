# Builds the web and API images on every push to main and rolls them out to the Scaleway
# Serverless Containers (see DEPLOY.md). Only the image whose sources changed is rebuilt;
# "Run workflow" in the Actions tab rebuilds both.
#
# Repository secrets:
#   SCW_SECRET_KEY        secret key of the IAM application kellerkompass-deploy
#                         (needs ContainerRegistryFullAccess and ContainersFullAccess in the project)
#   SCW_WEB_CONTAINER_ID  ID of the web Serverless Container
#   SCW_API_CONTAINER_ID  ID of the API Serverless Container
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: nl-ams
  REGISTRY: rg.nl-ams.scw.cloud/kellerkompass
  API_PUBLIC_URL: https://api.kellerkompass.de
  WEB_URL: https://kellerkompass.de

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'Dockerfile.web'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
            api:
              - 'packages/api/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'Dockerfile.api'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # API first: it applies pending migrations on start, before the web image relies on them.
      max-parallel: 1
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
            container_secret: SCW_API_CONTAINER_ID
          - service: web
            dockerfile: Dockerfile.web
            container_secret: SCW_WEB_CONTAINER_ID
    steps:
      - name: Skip unchanged service
        id: gate
        run: echo "run=${{ needs.changes.outputs[matrix.service] }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - uses: docker/login-action@v3
        if: steps.gate.outputs.run == 'true'
        with:
          registry: rg.nl-ams.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Only the web image uses these; the API Dockerfile ignores unknown build args.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_PUBLIC_URL }}
            WEB_URL=${{ env.WEB_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Point the container at the commit's tag (so a rollback is just the previous SHA).
      # Updating the container redeploys it.
      - name: Roll out
        if: steps.gate.outputs.run == 'true'
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          CONTAINER_ID: ${{ secrets[matrix.container_secret] }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$CONTAINER_ID" || { echo "::error::Secret ${{ matrix.container_secret }} is not set"; exit 1; }
          base="https://api.scaleway.com/containers/v1beta1/regions/$REGION/containers/$CONTAINER_ID"
          curl -fsS -X PATCH "$base" -H "X-Auth-Token: $SCW_SECRET_KEY" -H 'Content-Type: application/json' \
            -d "{\"registry_image\": \"$IMAGE\"}" > /dev/null
          # Wait until the new revision is ready (or report why it is not). The short head start
          # keeps the loop from reading the old revision's "ready" before the rollout begins.
          sleep 15
          for _ in $(seq 1 60); do
            status=$(curl -fsS "$base" -H "X-Auth-Token: $SCW_SECRET_KEY" | jq -r .status)
            echo "status: $status"
            case "$status" in
              ready) exit 0 ;;
              error) curl -fsS "$base" -H "X-Auth-Token: $SCW_SECRET_KEY" | jq -r .error_message; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Container not ready after 10 minutes"
          exit 1
